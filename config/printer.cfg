  ## Voron Design VORON2 300 SKR 1.4 TMC2209 UART config

#####################################################################
# 	Includes
#####################################################################
[include macros/*.cfg]
[include mainsail.cfg]
[include KAMP_Settings.cfg]

[exclude_object]
[skew_correction]

[include components/mcu.cfg]
[include components/mcu.z.cfg]

[printer]
kinematics: corexy
max_velocity: 600  
max_accel: 6000    			#Max 4000
max_z_velocity: 25 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 500
square_corner_velocity: 5.0

[idle_timeout]
timeout: 3600

#####################################################################
# 	Stepper Settings
#####################################################################

[include components/stepper_x.cfg]
[include components/stepper_y.cfg]
[include components/stepper_z.cfg]


#####################################################################
# 	Extruder
#####################################################################

[include components/extruder.cfg]

#####################################################################
# 	Autotuning
#####################################################################

[include components/stepper_x.autotune.cfg]
[include components/stepper_y.autotune.cfg]
[include components/stepper_z.autotune.cfg]

#####################################################################
# 	Bed Heater
#####################################################################

[include components/heater_bed.cfg]


#####################################################################
# 	Probe
#####################################################################

[include components/probe.cfg]

#####################################################################
# 	Fan Control
#####################################################################

[include components/fans.cfg]

#####################################################################
# Chamber Thermistor
#####################################################################
[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: P0.25

#####################################################################
# 	Hokey shit
#####################################################################
[verify_heater heater_bed]
max_error: 140
check_gain_time: 60

#####################################################################
# 	LED Control
#####################################################################

[output_pin caselight]
pin: P2.5
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.01
#####################################################################
# 	Displays
#####################################################################

[display]
##	mini12864 LCD Display
lcd_type: uc1701
cs_pin: z:P1.18
a0_pin: z:P1.19
encoder_pins: ^z:P3.26,^z:P3.25
click_pin: ^!z:P0.28
contrast: 63

[neopixel fysetc_mini12864]
##	To control Neopixel RGB in mini12864 display
pin: z:P1.21
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

##	Set RGB values on boot up for each Neopixel. 
##	Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=0
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3 

[bed_mesh]
speed: 300
horizontal_move_z: 5
probe_count: 10,10

[neopixel rgb_left]
pin: P1.24
chain_count: 18
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5
initial_WHITE: 0.5

[neopixel rgb_right]
pin: z:P1.24
chain_count: 18
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5
initial_WHITE: 0.5

