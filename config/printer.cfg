[include mainsail.cfg]
[include components/mcu.cfg]
[include components/ebb36.mcu.cfg]
[include components/ebb36.extruder.cfg]
[include components/probe.cfg]
[include components/steppers.cfg]
[include components/bed.cfg]
[include components/z_calibration.cfg]
[include components/autotune.cfg]
[include macros/homing.cfg]
[include macros/klicky/klicky-probe.cfg]
[include macros/print_start_stop.cfg]
[include macros/test_speed.cfg]
[include KAMP_Settings.cfg]

[exclude_object]

[virtual_sdcard]
path: /home/zerotri/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 12000
max_z_velocity: 10
max_z_accel: 30

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 121.2
shaper_type_y: 3hump_ei
shaper_freq_y: 78.4

[gcode_arcs]
resolution: 0.2

