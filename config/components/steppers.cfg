####################################################################
## STEPPER CONFIGURATIONS
####################################################################

## Stepper X configuration
## ----------------------------------------
[stepper_x]
step_pin: PE2
dir_pin: PB4
enable_pin: !PC11
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 165
position_min: -5
position_max: 165
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

# rotation_distance: 32
# microsteps: 16
# full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
# position_min: 0
# homing_speed: 125  
# homing_retract_dist: 5
# homing_positive_dir: true

# position_max: 1000
# position_endstop: 1000

# Stepper X UART config
# ----------------------------------------
[tmc2209 stepper_x]
uart_pin: PC10
interpolate: False
run_current: 0.6        # For V0.1 spec NEMA14 40Ncm
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PF3
driver_SGTHRS: 112


## Stepper Y configuration
## ----------------------------------------
[stepper_y]
##  A Stepper - Right
step_pin: PF12
dir_pin: PF11
enable_pin: !PB3
endstop_pin: tmc2209_stepper_y:virtual_endstop

rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
position_min: -24
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: true

position_max: 170
position_endstop: 170

# Stepper Y UART config
# ----------------------------------------
[tmc2209 stepper_y]
uart_pin: PF13
interpolate: False
run_current: 0.6        # For V0.1 spec NEMA14 40Ncm
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PF4
driver_SGTHRS: 112
 

## Z Stepper - Left Z Motor configuration
## ----------------------------------------
[stepper_z]
step_pin: PD7
dir_pin: !PD6
enable_pin: !PF10

rotation_distance: 8    # For T8x8 integrated lead screw
microsteps: 32
full_steps_per_rotation: 200


##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
# position_endstop: 1.3

# All builds use same Max Z
position_max: 150
position_min: -5	#200 for 1.8 degree, 400 for 0.9 degree
# endstop_pin: PC1
endstop_pin: probe:z_virtual_endstop
homing_speed: 8.0
second_homing_speed: 3
homing_retract_dist: 0


# Stepper Z UART config
# ----------------------------------------
[tmc2209 stepper_z]
uart_pin: PF9
run_current: 0.6       # For V0.1 spec NEMA17 LDO-42STH25-1004CL200E 1.0A  
sense_resistor: 0.110
# stealthchop_threshold: 0


## Z1 Stepper - Rear Z Motor configuration
## ----------------------------------------
[stepper_z1]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD5

rotation_distance: 8    # For T8x8 integrated lead screw
microsteps: 32
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree

# Stepper Z UART config
# ----------------------------------------
[tmc2209 stepper_z1]
uart_pin: PD4
run_current: 0.6    # For V0.1 spec NEMA17 LDO-42STH25-1004CL200E 1.0A  
sense_resistor: 0.110
# stealthchop_threshold: 0


## Z2 Stepper - Right Z Motor configuration
## ----------------------------------------
[stepper_z2]
step_pin: PC9
dir_pin: !PC8
enable_pin: !PD1

rotation_distance: 8    # For T8x8 integrated lead screw
microsteps: 32
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree


# Stepper Z UART config
# ----------------------------------------
[tmc2209 stepper_z2]
uart_pin: PD0
run_current: 0.6       # For V0.1 spec NEMA17 LDO-42STH25-1004CL200E 1.0A  
sense_resistor: 0.110
# stealthchop_threshold: 0


[probe]
pin: ^EBBCan: PB6
x_offset: 0
y_offset: 0